[package]
name = "folio"
version = "0.1.0"
description = "Folio — leitor de PDF leve para macOS e Windows"
authors = ["Folio"]
edition = "2021"
license = "MIT"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
folio-sign = { path = "../crates/folio-sign" }
