[package]
name = "tsuro-tauri"
version = "0.1.0"
description = "Tsuro — leitor de PDF leve para macOS e Windows"
authors = ["Tsuro"]
edition = "2021"
license = "MIT"

[lib]
name = "tsuro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsuro-sign = { path = "../crates/tsuro-sign" }
