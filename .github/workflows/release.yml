name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Testes Rust
        shell: bash
        run: |
          cargo test -p tsuro --lib -- --test-threads=1
          cargo test -p tsuro-sign --lib
      - name: Testes do instalador Bun
        run: bun test scripts/install-tsuro
      - name: DMG
        run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/TsuroPDF-*-aarch64-apple-darwin.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Testes Rust
        shell: bash
        run: |
          cargo test -p tsuro --lib -- --test-threads=1
          cargo test -p tsuro-sign --lib
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Instalador
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: dist/TsuroPDF-*-x86_64-pc-windows-msvc-setup.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} out/ \;
          test "$(find out -type f | wc -l)" -ge 2
          cd out
          sha256sum * | tee SHA256SUMS
          NOTES="$(mktemp)"
          cat >"$NOTES" <<EOF
          TsuroPDF ${GITHUB_REF_NAME} — navegação, impressão e modos de leitura

          Novidades desde a v0.1.1:

          - **Ir para a página**: clique no número da página e digite o destino. Atalhos PgUp/PgDn/Home/End e setas; pré-render direcional das páginas vizinhas (cache ≤ 64 MiB).
          - **Impressão própria**: diálogo com pré-visualização, impressora, intervalo de páginas, cópias e orientação. Monta um PDF de impressão (~200 DPI, página como imagem via XObject compartilhado) e envia direto para a fila (CUPS no Mac, winspool no Windows).
          - **Girar vista (R)**: gira só a exibição em passos de 90° — o arquivo não é alterado e a impressão sai sem rotação.
          - **Retomar leitura**: reabrir um documento volta à última página lida (posição salva por arquivo). Voltar/avançar percorre o histórico de páginas visitadas.
          - **Rolagem contínua**: alterna entre página única e rolagem contínua do documento inteiro.
          - **Sumário**: PDFs com sumário ganham a aba Sumário no painel lateral — árvore clicável com expandir/colapsar e salto para a seção.
          - **Botão início + ícone novo**: volta para a tela inicial com ícone Ori em origami; ícone novo do app (tsuru sobre fundo Kiri).

          **Full Changelog**: https://github.com/claudioorjunior/tsuro-pdf/compare/v0.1.1...${GITHUB_REF_NAME}

          Instalação:

          - Mac Apple Silicon: \`TsuroPDF-*-aarch64-apple-darwin.dmg\` — arraste para Applications.
            Na primeira abertura: clique com o botão direito em TsuroPDF → Abrir (assinatura ad-hoc, sem Apple Developer Program).
          - Windows x64: \`TsuroPDF-*-x86_64-pc-windows-msvc-setup.exe\` — instala em %LOCALAPPDATA%\\Programs\\TsuroPDF, sem admin.
            Se o SmartScreen aparecer: Mais informações → Executar assim mesmo.

          SHA-256 em \`SHA256SUMS\`. Instalador terminal: \`bun run install:tsuro -- --install\`.
          EOF
          gh release create "$GITHUB_REF_NAME" --title "TsuroPDF ${GITHUB_REF_NAME}" --notes-file "$NOTES" ./*
