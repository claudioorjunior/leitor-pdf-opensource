[package]
name = "folio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tsuro, leitor de PDF nativo (iced)"

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
folio-sign = { path = "../folio-sign" }
iced = { version = "0.13", features = ["image", "tokio"] }
pdfium-render = "0.8"
rfd = "0.15"
thiserror = "2"
unicode-normalization = "0.1"
