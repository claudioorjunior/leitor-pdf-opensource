[package]
name = "tsuro"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tsuro, leitor de PDF nativo (iced)"

[[bin]]
name = "tsuro"
path = "src/main.rs"

[dependencies]
tsuro-sign = { path = "../tsuro-sign" }
iced = { version = "0.13", features = ["image", "svg", "tokio"] }
pdfium-render = "0.8"
rfd = "0.15"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt"] }
unicode-normalization = "0.1"
