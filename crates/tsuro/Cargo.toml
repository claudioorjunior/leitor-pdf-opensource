[package]
name = "tsuro"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "TsuroPDF, leitor de PDF nativo (iced)"

[[bin]]
name = "TsuroPDF"
path = "src/main.rs"

[dependencies]
tsuro-sign = { path = "../tsuro-sign" }
iced = { version = "0.13", features = ["image", "svg", "tokio"] }
pdfium-render = "0.8"
rfd = "0.15"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt"] }
unicode-normalization = "0.1"
pdf-writer = "0.15"
miniz_oxide = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSPrintPanel",
] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = [
    "std",
    "PDFDocument",
    "objc2-app-kit",
] }
